[project]
name = "shape-of-motion"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "viser",
    "opencv-python",
    "imageio",
    "imageio-ffmpeg",
    "matplotlib",
    "tensorboard",
    "nerfview",
    "scikit-learn",
    "jaxtyping",
    "roma",
    "pytorch-msssim",
    "torchmetrics",
    "splines==0.3.2",
    "ninja",
    "fsspec",
    "loguru",
    "ipdb",
    "pyyaml",
    "tyro",
    "tqdm",
    "cuml-cu12==24.12.*",
    "gsplat==1.4.0",
    "gdown>=5.2.1",
    "einops>=0.8.2",
    "timm>=1.0.25",
    "xformers>=0.0.29.post3",
    "wandb>=0.25.1",
    "nvidia-cuda-nvcc>=13.4.59",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flow3d*"]

[project.optional-dependencies]
preproc = [
    "gdown",
    "transformers",
    "gradio",
    "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git",
    "typing_extensions",
    "mediapy",
    "einshape",
]
dev = ["black==24.4.2", "isort==5.13.2"]

# cu130, not cu124: Blackwell GPUs (RTX 50-series, compute capability 12.0) have no
# kernels in any CUDA 12.4 build, so every custom op dies with "no kernel image is
# available for execution on the device" -- while ordinary ops still run, so the
# failure is partial and a pipeline can produce plausible output from a broken stage.
[[tool.uv.index]]
name = "pytorch-cu13"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu13" }
torchvision = { index = "pytorch-cu13" }
cuml-cu12 = { index = "nvidia" }
